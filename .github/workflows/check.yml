name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Cache Android SDK packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-37.0
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/37.0.0
          key: ${{ runner.os }}-android-sdk-37.0.0
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew precommit
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: '**/build/outputs/apk/debug/*.apk'
