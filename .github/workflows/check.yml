name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Cache Android SDK packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/android-sdk-cache/platforms/android-37.0
            ${{ runner.temp }}/android-sdk-cache/build-tools/37.0.0
          key: ${{ runner.os }}-android-sdk-37.0.0
      - name: Restore cached Android SDK packages
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/platforms" "$ANDROID_SDK_ROOT/build-tools"
          cp -a "$RUNNER_TEMP/android-sdk-cache/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/" 2>/dev/null || true
          cp -a "$RUNNER_TEMP/android-sdk-cache/build-tools/37.0.0" "$ANDROID_SDK_ROOT/build-tools/" 2>/dev/null || true
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Stage Android SDK packages for caching
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk-cache/platforms" "$RUNNER_TEMP/android-sdk-cache/build-tools"
          rm -rf "$RUNNER_TEMP/android-sdk-cache/platforms/android-37.0" "$RUNNER_TEMP/android-sdk-cache/build-tools/37.0.0"
          cp -a "$ANDROID_SDK_ROOT/platforms/android-37.0" "$RUNNER_TEMP/android-sdk-cache/platforms/"
          cp -a "$ANDROID_SDK_ROOT/build-tools/37.0.0" "$RUNNER_TEMP/android-sdk-cache/build-tools/"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew precommit
      - uses: actions/upload-artifact@v6
        with:
          name: debug-apks
          path: '**/build/outputs/apk/debug/*.apk'
