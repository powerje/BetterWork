[versions]
kotlin = "2.3.21"
agp = "9.4.0"
coroutines = "1.10.2"
serialization = "1.9.0"
sqldelight = "2.1.0"
molecule = "2.2.0"
kermit = "2.0.8"
compose = "2026.02.01"
activity = "1.12.4"
wear = "1.6.2"
detekt = "1.23.8"
ktfmt = "0.25.0"

[libraries]
glance-appwidget = { module = "androidx.glance:glance-appwidget", version = "1.2.0" }
glance-material3 = { module = "androidx.glance:glance-material3", version = "1.2.0" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version = "1.0.0" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version = "1.0.0" }
compose-icons = { module = "androidx.compose.material:material-icons-core", version = "1.7.8" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
coroutines-play = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
sqlite-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqlite-jvm = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqlite-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
molecule = { module = "app.cash.molecule:molecule-runtime", version.ref = "molecule" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
turbine = { module = "app.cash.turbine:turbine", version = "1.2.1" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
wear-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wear" }
wear-navigation3 = { module = "androidx.wear.compose:compose-navigation3", version.ref = "wear" }
wear-tooling = { module = "androidx.wear.compose:compose-ui-tooling", version.ref = "wear" }
wear-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wear" }
wear-ongoing = { module = "androidx.wear:wear-ongoing", version = "1.1.0" }
core = { module = "androidx.core:core-ktx", version = "1.17.0" }
play-wear = { module = "com.google.android.gms:play-services-wearable", version = "19.0.0" }

android-test-core = { module = "androidx.test:core", version = "1.7.0" }
android-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
android-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
android-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.3.0" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
